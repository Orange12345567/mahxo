<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagotchi Club: Sahur, Kirk & Mirsab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
        }
        .arabic-font {
            font-family: 'Tajawal', sans-serif !important;
        }
        .tamagotchi-screen {
            background: #e2f1af;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
        }
        .character-bounce {
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .sparkle {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Game Container -->
    <div id="game-card" class="w-full max-w-md bg-white rounded-3xl shadow-2xl border-4 border-pink-300 p-6 flex flex-col items-center relative overflow-hidden">
        
        <!-- Header & Character Selector -->
        <h1 id="ui-title" class="text-2xl font-black text-pink-600 mb-3 text-center tracking-wide">
            ✨ TAMAGOTCHI PET CARE ✨
        </h1>

        <div class="grid grid-cols-3 gap-2 w-full mb-4">
            <button onclick="selectCharacter('tung')" id="btn-tung" class="char-btn p-2 rounded-xl border-2 border-pink-400 bg-pink-100 hover:bg-pink-200 transition text-xs font-bold text-gray-800 text-center">
                🥁 <span id="name-tung">Tung Tung Sahur</span>
            </button>
            <button onclick="selectCharacter('kirk')" id="btn-kirk" class="char-btn p-2 rounded-xl border-2 border-gray-300 bg-gray-100 hover:bg-gray-200 transition text-xs font-bold text-gray-800 text-center">
                🎯 <span id="name-kirk">Charlie Kirk</span>
            </button>
            <button onclick="selectCharacter('mirsab')" id="btn-mirsab" class="char-btn p-2 rounded-xl border-2 border-gray-300 bg-gray-100 hover:bg-gray-200 transition text-xs font-bold text-gray-800 text-center">
                🌙 <span id="name-mirsab">Mirsab Ali</span>
            </button>
        </div>

        <!-- Virtual Pet Screen -->
        <div class="w-full tamagotchi-screen rounded-2xl border-4 border-lime-600 p-4 relative mb-4 flex flex-col items-center min-h-[280px] justify-between">
            
            <!-- Speech Bubble / Status Alert -->
            <div id="speech-bubble" class="bg-white/90 px-3 py-1 rounded-full text-xs font-bold text-gray-700 shadow-sm border border-lime-500 mb-2 text-center max-w-[90%]">
                Tung Tung Tung Sahur! Wake up! 🥁
            </div>

            <!-- Pet Character Display -->
            <div class="relative w-36 h-36 flex items-center justify-center my-2">
                <!-- Base Avatar Placeholder -->
                <div id="character-avatar" class="character-bounce text-7xl select-none relative z-10 filter drop-shadow-md">
                    🥁
                </div>
                <!-- Outfit Overlay Badge -->
                <div id="outfit-badge" class="absolute -top-2 -right-2 bg-yellow-300 border-2 border-yellow-600 rounded-full w-10 h-10 flex items-center justify-center text-xl shadow z-20">
                    👤
                </div>
            </div>

            <!-- Stat Bars -->
            <div class="w-full space-y-1.5 text-xs font-bold">
                <div>
                    <div class="flex justify-between text-gray-700 mb-0.5">
                        <span id="label-hunger">🍖 Hunger</span>
                        <span id="val-hunger">80%</span>
                    </div>
                    <div class="w-full bg-lime-200 rounded-full h-3 border border-lime-600 overflow-hidden">
                        <div id="bar-hunger" class="bg-red-500 h-full transition-all duration-300" style="width: 80%"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-gray-700 mb-0.5">
                        <span id="label-hygiene">🧼 Cleanliness</span>
                        <span id="val-hygiene">90%</span>
                    </div>
                    <div class="w-full bg-lime-200 rounded-full h-3 border border-lime-600 overflow-hidden">
                        <div id="bar-hygiene" class="bg-blue-500 h-full transition-all duration-300" style="width: 90%"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-gray-700 mb-0.5">
                        <span id="label-happiness">💖 Happiness</span>
                        <span id="val-happiness">100%</span>
                    </div>
                    <div class="w-full bg-lime-200 rounded-full h-3 border border-lime-600 overflow-hidden">
                        <div id="bar-happiness" class="bg-pink-500 h-full transition-all duration-300" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-3 gap-2 w-full mb-3">
            <button onclick="feedPet()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold py-2 px-3 rounded-xl shadow border-b-4 border-amber-600 active:translate-y-0.5 transition flex items-center justify-center gap-1 text-sm">
                🍗 <span id="btn-feed">Feed</span>
            </button>
            <button onclick="washPet()" class="bg-cyan-400 hover:bg-cyan-500 text-cyan-950 font-bold py-2 px-3 rounded-xl shadow border-b-4 border-cyan-600 active:translate-y-0.5 transition flex items-center justify-center gap-1 text-sm">
                🧼 <span id="btn-wash">Wash</span>
            </button>
            <button onclick="playPet()" class="bg-emerald-400 hover:bg-emerald-500 text-emerald-950 font-bold py-2 px-3 rounded-xl shadow border-b-4 border-emerald-600 active:translate-y-0.5 transition flex items-center justify-center gap-1 text-sm">
                🎮 <span id="btn-play">Play</span>
            </button>
        </div>

        <!-- Wardrobe / Outfit Selector -->
        <div class="w-full bg-purple-50 rounded-2xl p-3 border-2 border-purple-200">
            <h2 id="label-wardrobe" class="text-xs font-extrabold text-purple-700 mb-2 uppercase tracking-wider text-center">
                👗 Dressing Room / Wardrobe
            </h2>
            <div class="grid grid-cols-4 gap-1.5">
                <button onclick="changeOutfit('default')" class="bg-white hover:bg-purple-100 border border-purple-300 rounded-lg py-1.5 text-xs font-bold text-purple-800 text-center">
                    👤 <span id="outfit-default">Default</span>
                </button>
                <button onclick="changeOutfit('fursuit')" class="bg-white hover:bg-purple-100 border border-purple-300 rounded-lg py-1.5 text-xs font-bold text-purple-800 text-center">
                    🦊 <span id="outfit-fursuit">Fursuit</span>
                </button>
                <button onclick="changeOutfit('maid')" class="bg-white hover:bg-purple-100 border border-purple-300 rounded-lg py-1.5 text-xs font-bold text-purple-800 text-center">
                    🧹 <span id="outfit-maid">Maid</span>
                </button>
                <button onclick="changeOutfit('suit')" class="bg-white hover:bg-purple-100 border border-purple-300 rounded-lg py-1.5 text-xs font-bold text-purple-800 text-center">
                    🎩 <span id="outfit-suit">Tuxedo</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // Game State
        const state = {
            character: 'tung', // 'tung', 'kirk', 'mirsab'
            hunger: 80,
            hygiene: 90,
            happiness: 100,
            outfit: 'default',
            lang: 'en'
        };

        // Translations Dictionary
        const i18n = {
            en: {
                title: "✨ TAMAGOTCHI PET CARE ✨",
                tungName: "Tung Tung Sahur",
                kirkName: "Charlie Kirk",
                mirsabName: "Mirsab Ali",
                hunger: "🍖 Hunger",
                hygiene: "🧼 Cleanliness",
                happiness: "💖 Happiness",
                feed: "Feed",
                wash: "Wash",
                play: "Play",
                wardrobe: "👗 Dressing Room / Wardrobe",
                outfitDefault: "Normal",
                outfitFursuit: "Fursuit",
                outfitMaid: "Maid",
                outfitSuit: "Tuxedo",
                quotes: {
                    tung: ["Tung Tung Tung Sahur! Wake up!", "Time for Sahur! 🥁", "Feelin' cute in this outfit!"],
                    kirk: ["Turning point Tamagotchi!", "Let's debate the best pet food.", "Facts don't care about your hunger!"],
                    mirsab: ["Welcome my friends!", "Ready to play!", "Looking good!"]
                }
            },
            ar: {
                title: "✨ لعبة العناية بالتاماجوتشي ✨",
                tungName: "تونغ تونغ سحور",
                kirkName: "تشارلي كيرك",
                mirsabName: "ميرساب علي",
                hunger: "🍖 الجوع",
                hygiene: "🧼 النظافة",
                happiness: "💖 السعادة",
                feed: "إطعام",
                wash: "تنظيف",
                play: "لعب",
                wardrobe: "👗 خزانة الملابس والزي",
                outfitDefault: "عادي",
                outfitFursuit: "بدلة فرو",
                outfitMaid: "خادمة",
                outfitSuit: "بدلة رسمية",
                quotes: {
                    tung: ["تونغ تونغ تونغ سحور! استيقظ!", "حان وقت السحور! 🥁", "مظهر رائع اليوم!"],
                    kirk: ["نقطة التحول تاماجوتشي!", "دعنا نتناقش حول أفضل طعام للحيوانات.", "الحقائق لا تهتم بجوعك!"],
                    mirsab: ["أهلاً وسهلاً بكم جميعا!", "جاهز للعب والمرح!", "أنظف وأجمل إطلالة!"]
                }
            }
        };

        // Character Visual Representations
        const avatars = {
            tung: "🥁",
            kirk: "🎯",
            mirsab: "🌙"
        };

        const outfitBadges = {
            default: "👤",
            fursuit: "🦊",
            maid: "🧹",
            suit: "🎩"
        };

        function selectCharacter(char) {
            state.character = char;
            
            // Highlight Button
            document.querySelectorAll('.char-btn').forEach(btn => {
                btn.classList.remove('bg-pink-100', 'border-pink-400');
                btn.classList.add('bg-gray-100', 'border-gray-300');
            });
            const selectedBtn = document.getElementById(`btn-${char}`);
            selectedBtn.classList.remove('bg-gray-100', 'border-gray-300');
            selectedBtn.classList.add('bg-pink-100', 'border-pink-400');

            // Switch UI Language based on character
            if (char === 'mirsab') {
                state.lang = 'ar';
                document.body.classList.add('arabic-font');
                document.getElementById('game-card').setAttribute('dir', 'rtl');
            } else {
                state.lang = 'en';
                document.body.classList.remove('arabic-font');
                document.getElementById('game-card').setAttribute('dir', 'ltr');
            }

            updateUI();
            triggerSpeech(getRandomQuote());
        }

        function changeOutfit(outfit) {
            state.outfit = outfit;
            state.happiness = Math.min(100, state.happiness + 10);
            updateUI();
            
            const txt = state.lang === 'ar' ? `تم تغيير الزي إلى ${i18n.ar['outfit' + capitalize(outfit)]}!` : `Changed outfit to ${i18n.en['outfit' + capitalize(outfit)]}!`;
            triggerSpeech(txt);
        }

        function capitalize(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function feedPet() {
            if (state.hunger >= 100) {
                triggerSpeech(state.lang === 'ar' ? "أنا شبعان جداً!" : "I'm already full!");
                return;
            }
            state.hunger = Math.min(100, state.hunger + 25);
            updateUI();
            triggerSpeech(state.lang === 'ar' ? "يممم! طعام لديد! 🍎" : "Yum! Delicious food! 🍎");
        }

        function washPet() {
            if (state.hygiene >= 100) {
                triggerSpeech(state.lang === 'ar' ? "أنا نظيف بالفعل! ✨" : "I'm already super clean! ✨");
                return;
            }
            state.hygiene = 100;
            updateUI();
            triggerSpeech(state.lang === 'ar' ? "فقاعات صابون رائعة! 🧼" : "Squeaky clean bubbles! 🧼");
        }

        function playPet() {
            if (state.hunger < 15) {
                triggerSpeech(state.lang === 'ar' ? "أنا جائع جداً للعب..." : "Too hungry to play...");
                return;
            }
            state.happiness = Math.min(100, state.happiness + 20);
            state.hunger = Math.max(0, state.hunger - 10);
            updateUI();
            triggerSpeech(state.lang === 'ar' ? "هذا ممتع للغاية! 🎉" : "That was so much fun! 🎉");
        }

        function getRandomQuote() {
            const list = i18n[state.lang].quotes[state.character];
            return list[Math.floor(Math.random() * list.length)];
        }

        function triggerSpeech(text) {
            document.getElementById('speech-bubble').innerText = text;
        }

        function updateUI() {
            const t = i18n[state.lang];

            // Labels
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('name-tung').innerText = t.tungName;
            document.getElementById('name-kirk').innerText = t.kirkName;
            document.getElementById('name-mirsab').innerText = t.mirsabName;
            document.getElementById('label-hunger').innerText = t.hunger;
            document.getElementById('label-hygiene').innerText = t.hygiene;
            document.getElementById('label-happiness').innerText = t.happiness;
            document.getElementById('btn-feed').innerText = t.feed;
            document.getElementById('btn-wash').innerText = t.wash;
            document.getElementById('btn-play').innerText = t.play;
            document.getElementById('label-wardrobe').innerText = t.wardrobe;

            document.getElementById('outfit-default').innerText = t.outfitDefault;
            document.getElementById('outfit-fursuit').innerText = t.outfitFursuit;
            document.getElementById('outfit-maid').innerText = t.outfitMaid;
            document.getElementById('outfit-suit').innerText = t.outfitSuit;

            // Avatars & Outfits
            document.getElementById('character-avatar').innerText = avatars[state.character];
            document.getElementById('outfit-badge').innerText = outfitBadges[state.outfit];

            // Stat Values
            document.getElementById('val-hunger').innerText = `${state.hunger}%`;
            document.getElementById('val-hygiene').innerText = `${state.hygiene}%`;
            document.getElementById('val-happiness').innerText = `${state.happiness}%`;

            // Bar Widths
            document.getElementById('bar-hunger').style.width = `${state.hunger}%`;
            document.getElementById('bar-hygiene').style.width = `${state.hygiene}%`;
            document.getElementById('bar-happiness').style.width = `${state.happiness}%`;
        }

        // Tamagotchi Status Decay (Every 5 seconds)
        setInterval(() => {
            state.hunger = Math.max(0, state.hunger - 3);
            state.hygiene = Math.max(0, state.hygiene - 2);
            state.happiness = Math.max(0, state.happiness - 2);
            updateUI();
        }, 5000);

        // Initial setup
        updateUI();
    </script>
</body>
</html>
